                            <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FALLEN MINIS - Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --accent: #25D366;
            --bg: #0a0a0a;
            --card-bg: #141414;
            --border: #222;
            --text-main: #e0e0e0;
            --text-dim: #888;
            --font-main: 'Inter', sans-serif;
            --font-title: 'Outfit', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); font-family: var(--font-main); color: var(--text-main); line-height: 1.5; }
        
        .wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 500px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 24px; padding: 30px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
        
        h2 { font-family: var(--font-title); font-weight: 900; letter-spacing: -0.03em; text-transform: uppercase; text-align: center; margin-bottom: 5px; font-size: 26px; }
        .rate-info { text-align: center; font-size: 11px; color: var(--accent); margin-bottom: 20px; text-transform: uppercase; font-weight: 700; cursor: pointer; border: 1px solid #333; padding: 8px; border-radius: 10px; }

        .nav-tabs { display: flex; gap: 10px; margin-bottom: 25px; background: #000; padding: 6px; border-radius: 16px; }
        .nav-btn { flex: 1; background: transparent; border: none; color: var(--text-dim); padding: 12px; border-radius: 12px; cursor: pointer; font-size: 11px; font-weight: 700; text-transform: uppercase; transition: all 0.2s ease; font-family: var(--font-title); }
        .nav-btn.active { background: #fff; color: #000; }

        .input-box { background: #1f1f1f; border: 1px solid #2a2a2a; border-radius: 12px; padding: 14px; margin-bottom: 12px; width: 100%; color: #fff; font-size: 14px; outline: none; font-family: var(--font-main); }
        .label { display: block; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; font-weight: 700; font-family: var(--font-title); }

        .catalog-results { position: absolute; background: #222; border: 1px solid #444; border-radius: 12px; max-height: 200px; overflow-y: auto; z-index: 1000; width: 100%; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5); top: 50px; }
        .catalog-option { padding: 12px; font-size: 12px; cursor: pointer; border-bottom: 1px solid #333; color: #eee; line-height: 1.3; }
        .catalog-option:hover { background: #333; color: var(--accent); }

        .client-item { background: #1a1a1a; padding: 22px; border-radius: 20px; margin-bottom: 14px; border: 1px solid var(--border); border-left: 4px solid var(--accent); position: relative; }
        .status-badge { flex: 1; text-align: center; padding: 10px 5px; border-radius: 10px; font-size: 8px; font-weight: 900; border: 1px solid #222; background: #0f0f0f; color: #444; cursor: pointer; font-family: var(--font-title); }
        .status-paid { background: var(--accent) !important; color: #000 !important; }

        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 1000; overflow-y: auto; padding: 90px 25px; color: #111; }
        .close-overlay { position: fixed; top: 20px; right: 20px; background: #111; color: #fff; border: none; padding: 14px 24px; border-radius: 50px; font-weight: 700; font-size: 12px; cursor: pointer; z-index: 1010; font-family: var(--font-title); }
        
        .edit-row { display: flex; gap: 8px; margin-bottom: 8px; position: relative; }
        .btn-del { background: #ff4757; color: #fff; border: none; border-radius: 8px; padding: 0 10px; cursor: pointer; }
        .wa-btn { background: var(--accent); color: #000; border: none; padding: 18px; width: 100%; border-radius: 16px; font-weight: 800; font-family: var(--font-title); font-size: 15px; cursor: pointer; margin-top: 15px; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="overlay">
    <button class="close-overlay" onclick="closeOverlay()">CERRAR Y GUARDAR</button>
    <div id="overlay-content"></div>
</div>

<div class="wrapper">
    <div class="card">
        <h2>FALLEN <span style="color:var(--accent)">MINIATURES</span></h2>
        <div class="rate-info" id="rate-display" onclick="updateManualRate()">Sincronizando...</div>
        
        <div class="nav-tabs">
            <button class="nav-btn active" id="b-calc" onclick="showTab('calc')">Cotizar</button>
            <button class="nav-btn" id="b-new" onclick="showTab('new')">Nuevo</button>
            <button class="nav-btn" id="b-list" onclick="showTab('list')">Base</button>
        </div>

        <div id="tab-calc">
            <input type="text" id="search-input" class="input-box" placeholder="Buscar cliente..." oninput="filterClients()" autocomplete="off">
            <div id="search-results" style="position:relative; background:#1f1f1f; display:none; border-radius:12px; margin-bottom:10px; max-height:150px; overflow-y:auto; z-index:100; border:1px solid #333"></div>
            
            <div id="items-container">
                <div class="item-row edit-row">
                    <div style="flex:2; position:relative;">
                        <input type="text" class="item-name input-box" placeholder="Producto..." style="margin:0; width:100%" oninput="searchCatalog(this)">
                        <div class="catalog-results"></div>
                    </div>
                    <input type="number" class="item-qty input-box" value="1" style="width:60px; margin:0" oninput="calculate()">
                    <input type="number" class="item-price input-box" placeholder="USD" style="width:80px; margin:0" oninput="calculate()">
                </div>
            </div>
            <button class="nav-btn" style="width:100%; border: 1px dashed #444; margin-bottom:20px;" onclick="addItemTab('items-container')">+ AÑADIR PRODUCTO</button>
            
            <label class="label">Descuento (ej: 100 o 10%)</label>
            <input type="text" id="calc-discount" class="input-box" value="0" oninput="calculate()">

            <label class="label">Envío</label>
            <div style="display:flex; gap:8px; margin-bottom:15px">
                <div class="ship-opt active" id="s-100" onclick="setShip(100)" style="flex:1; border:1px solid #333; padding:10px; border-radius:12px; text-align:center; font-size:10px; cursor:pointer">📦 $100</div>
                <div class="ship-opt" id="s-225" onclick="setShip(225)" style="flex:1; border:1px solid #333; padding:10px; border-radius:12px; text-align:center; font-size:10px; cursor:pointer">⚡ $225</div>
                <div class="ship-opt" id="s-0" onclick="setShip(0)" style="flex:1; border:1px solid #333; padding:10px; border-radius:12px; text-align:center; font-size:10px; cursor:pointer">🎁 Gratis</div>
            </div>

            <div id="res-div" style="display:none">
                <div style="background:#000; padding:20px; border-radius:20px; border-left:4px solid var(--accent)">
                    <div id="r-text" style="font-size:11px; color:#bbb"></div>
                    <div id="r-tot" style="font-size:20px; font-weight:900; color:#fff; margin-top:5px"></div>
                </div>
                <button class="wa-btn" onclick="sendWA()">ENVIAR</button>
                <button class="nav-btn" style="width:100%; margin-top:10px; border:1px solid var(--accent); color:var(--accent)" onclick="saveOrder()">REGISTRAR EN BASE</button>
            </div>
        </div>

        <div id="tab-new" style="display:none">
            <input type="text" id="c-nom" class="input-box" placeholder="Nombre completo">
            <input type="text" id="c-tel" class="input-box" placeholder="WhatsApp">
            <input type="email" id="c-mail" class="input-box" placeholder="E-mail">
            <textarea id="c-dir" class="input-box" placeholder="Dirección de envío" style="min-height:80px; resize:none"></textarea>
            <button class="wa-btn" style="background:#fff; color:#000" onclick="saveClient()">GUARDAR CLIENTE</button>
        </div>

        <div id="tab-list" style="display:none"><div id="client-list"></div></div>
    </div>
</div>

<script>
    const CATALOG_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTrUSvEa7fBbwChq6ycG3JUGUGVzQ1AQbYCDV1PsOlilKy5X-px_PkuIiHTl5IZ76xQ1khOP_9MKlKR/pub?gid=751903595&single=true&output=csv';
    const firebaseConfig = {
        apiKey: "AIzaSyDUYD_gMxeemWt-dfJrPtN8njzmV7HoJ48",
        authDomain: "fallen-cotizador.firebaseapp.com",
        databaseURL: "https://fallen-cotizador-default-rtdb.firebaseio.com",
        projectId: "fallen-cotizador"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentRate = 18.00, clipData = {}, lastCalc = {}, selectedClientId = "", currentShip = 100, catalogItems = [], activeCardId = null;

    // 1. Catálogo y Tipo de Cambio
    async function fetchCatalog() {
        try {
            const response = await fetch(CATALOG_URL, { cache: "no-store" });
            const data = await response.text();
            const rows = data.split(/\r?\n/).filter(row => row.trim() !== "");
            catalogItems = rows.map(row => {
                const cleanRow = row.replace(/^"|"$/g, '').replace(/""/g, '"').trim();
                const match = cleanRow.match(/(.+)\s*-\s*\$(\d+\.?\d*)\s*usd/i);
                if (match) return { desc: match[1].trim(), price: parseFloat(match[2]) };
                return null;
            }).filter(item => item !== null);
            fetchExchangeRate();
        } catch (e) { document.getElementById('rate-display').innerText = "ERROR CATÁLOGO"; }
    }

    async function fetchExchangeRate() {
        try {
            const res = await fetch('https://open.er-api.com/v6/latest/USD');
            const data = await res.json();
            if(data.rates.MXN) { currentRate = data.rates.MXN; updateRateUI(); }
        } catch(e) { updateRateUI(); }
    }

    function updateRateUI() { 
        document.getElementById('rate-display').innerText = `DÓLAR: $${currentRate.toFixed(2)} MXN`; 
        calculate(); 
    }

    function updateManualRate() { 
        let n = prompt("Cambio USD:", currentRate); 
        if(n){ currentRate = parseFloat(n); updateRateUI(); } 
    }

    // 2. Lógica de Redondeo
    function parseDiscount(val, subtotal) {
        if (!val) return 0;
        let sVal = val.toString().trim();
        if (sVal.endsWith('%')) {
            let pct = parseFloat(sVal.replace('%', '')) || 0;
            return Math.ceil(subtotal * (pct / 100));
        }
        return parseFloat(sVal) || 0;
    }

    function calculate() {
        let usd = 0;
        document.querySelectorAll('#tab-calc .item-row').forEach(r => {
            const q = parseFloat(r.querySelector('.item-qty').value) || 0;
            const p = parseFloat(r.querySelector('.item-price').value) || 0;
            usd += q * p;
        });
        if(usd > 0) {
            let mxn = usd * currentRate;
            let descInput = document.getElementById('calc-discount').value;
            let descMonto = Math.ceil(parseDiscount(descInput, mxn));
            let mxnConDesc = mxn - descMonto;
            lastCalc = { 
                ade: Math.ceil(mxnConDesc * 0.6), 
                sal: Math.ceil(mxnConDesc * 0.4), 
                ship: currentShip, 
                descVal: descInput, 
                descMonto: descMonto, 
                tot: Math.ceil(mxnConDesc) + currentShip 
            };
            document.getElementById('r-text').innerHTML = `60% Ant: $${lastCalc.ade} | 40% Sal: $${lastCalc.sal} | Env: $${currentShip}`;
            if(descMonto > 0) document.getElementById('r-text').innerHTML += ` | Desc: -$${descMonto}`;
            document.getElementById('r-tot').innerText = `TOTAL: $${lastCalc.tot} MXN`;
            document.getElementById('res-div').style.display = 'block';
        }
    }

    // 3. RECUPERACIÓN DE DATOS
    db.ref('clientes_v3').on('value', snap => {
        clipData = snap.val() || {};
        const list = document.getElementById('client-list'); 
        list.innerHTML = "";
        Object.keys(clipData).reverse().forEach(cid => {
            const cli = clipData[cid];
            if (cli.pedidos) {
                cli.pedidos.forEach((p, idx) => {
                    list.innerHTML += `
                    <div class="client-item">
                        <button style="position:absolute; top:15px; right:15px; background:none; border:none; color:#555; cursor:pointer" onclick="removeOrderCard('${cid}', ${idx})">×</button>
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:15px;">
                            <div onclick="openOverlay('${cid}', ${idx})" style="cursor:pointer; flex:1">
                                <div style="font-family:var(--font-title); font-size:18px; font-weight:700; color:#fff">${cli.nombre}</div>
                                <div style="font-size:10px; color:var(--text-dim)">Fecha: ${p.fecha}</div>
                            </div>
                            <button style="padding:8px; font-size:10px; background:var(--accent); border:none; border-radius:8px; font-weight:800; cursor:pointer; margin-top:5px;" onclick="sendCobranza('${cid}', ${idx})">COBRAR</button>
                        </div>
                        <div style="display:flex; gap:5px;">
                            <div class="status-badge ${p.pagA?'status-paid':''}" onclick="updatePay('${cid}', ${idx},'pagA',${p.pagA})">ANT. $${p.ade}</div>
                            <div class="status-badge ${p.pagS?'status-paid':''}" onclick="updatePay('${cid}', ${idx},'pagS',${p.pagS})">SAL. $${p.sal}</div>
                            <div class="status-badge ${p.pagE?'status-paid':''}" onclick="updatePay('${cid}', ${idx},'pagE',${p.pagE})">ENV. $${p.env}</div>
                        </div>
                    </div>`;
                });
            }
        });
    });

    function saveOrder() {
        if(!selectedClientId) return alert("Selecciona un cliente");
        let items = [];
        document.querySelectorAll('#tab-calc .item-row').forEach(r => {
            items.push({ nom: r.querySelector('.item-name').value, cant: r.querySelector('.item-qty').value, prec: r.querySelector('.item-price').value });
        });
        const cli = clipData[selectedClientId];
        if(!cli.pedidos) cli.pedidos = [];
        cli.pedidos.push({
            fecha: new Date().toLocaleDateString(), ...lastCalc, env: lastCalc.ship,
            items: items, pagA: false, pagS: false, pagE: false
        });
        db.ref(`clientes_v3/${selectedClientId}`).set(cli).then(() => {
            showTab('list');
            document.getElementById('search-input').value = "";
            selectedClientId = "";
        });
    }

    // 4. Overlay y Edición
    function openOverlay(cid, idx) {
        activeCardId = {cid, idx};
        const p = clipData[cid].pedidos[idx];
        let html = `
            <div style="font-weight:900; margin-bottom:20px; font-size:18px">EDITAR PEDIDO: ${clipData[cid].nombre}</div>
            <div id="items-edit-single">`;

        p.items.forEach(it => {
            html += `<div class="edit-row">
                <div style="flex:2; position:relative;"><input type="text" class="it-n" value="${it.nom}" oninput="searchCatalog(this); overlayRecalc()"><div class="catalog-results"></div></div>
                <input type="number" class="it-q" value="${it.cant}" style="width:45px" oninput="overlayRecalc()">
                <input type="number" class="it-p" value="${it.prec}" style="width:60px" oninput="overlayRecalc()">
                <button class="btn-del" onclick="this.parentElement.remove(); overlayRecalc()">X</button>
            </div>`;
        });
        
        html += `</div>
            <button class="nav-btn" style="width:100%; color:#111; border:1px solid #ccc; margin-top:10px" onclick="addItemOverlay()">+ PRODUCTO</button>
            <div style="margin-top:20px; background:#f9f9f9; padding:15px; border-radius:15px; border:1px solid #eee">
                <div style="display:flex; gap:10px">
                    <div style="flex:1">
                        <label class="label" style="color:#666">ADELANTO (60%)</label>
                        <input type="number" id="edit-ade-single" class="input-box" style="background:#fff; border:1px solid #ddd; color:#111" value="${p.ade}" oninput="syncManualMoney()">
                    </div>
                    <div style="flex:1">
                        <label class="label" style="color:#666">SALDO (40%)</label>
                        <input type="number" id="edit-sal-single" class="input-box" style="background:#fff; border:1px solid #ddd; color:#111" value="${p.sal}" oninput="syncManualMoney()">
                    </div>
                </div>
                <label class="label" style="color:#666; margin-top:10px">DESCUENTO</label>
                <input type="text" id="edit-desc-single" class="input-box" style="background:#fff; border:1px solid #ddd; color:#111" value="${p.descVal || 0}" oninput="overlayRecalc()">
                <label class="label" style="color:#666">ENVÍO MXN</label>
                <input type="number" id="edit-ship-single" class="input-box" style="background:#fff; border:1px solid #ddd; color:#111" value="${p.env}" oninput="overlayRecalc()">
                <div id="total-idx-single" style="font-weight:900; font-size:16px; margin-top:10px; border-top:1px solid #ddd; padding-top:10px">TOTAL: $${p.tot} MXN</div>
            </div>`;
        document.getElementById('overlay-content').innerHTML = html;
        document.getElementById('overlay').style.display = 'block';
    }

    function overlayRecalc() {
        if(!activeCardId) return;
        const {cid, idx} = activeCardId;
        const p = clipData[cid].pedidos[idx];
        let usd = 0;
        p.items = [];
        document.querySelectorAll('#items-edit-single .edit-row').forEach(r => {
            const q = parseFloat(r.querySelector('.it-q').value)||0;
            const pr = parseFloat(r.querySelector('.it-p').value)||0;
            usd += (q * pr);
            p.items.push({ nom: r.querySelector('.it-n').value, cant: q, prec: pr });
        });
        const ship = parseFloat(document.getElementById('edit-ship-single').value) || 0;
        const dIn = document.getElementById('edit-desc-single').value;
        let mxn = usd * currentRate;
        let dM = Math.ceil(parseDiscount(dIn, mxn));
        let mxnD = mxn - dM;

        p.ade = Math.ceil(mxnD * 0.6); 
        p.sal = Math.ceil(mxnD * 0.4); 
        p.env = ship; 
        p.descVal = dIn; 
        p.descMonto = dM; 
        p.tot = Math.ceil(mxnD) + ship;

        document.getElementById('edit-ade-single').value = p.ade;
        document.getElementById('edit-sal-single').value = p.sal;
        document.getElementById('total-idx-single').innerText = `TOTAL: $${p.tot} MXN`;
    }

    function syncManualMoney() {
        if(!activeCardId) return;
        const {cid, idx} = activeCardId;
        const p = clipData[cid].pedidos[idx];
        p.ade = parseFloat(document.getElementById('edit-ade-single').value) || 0;
        p.sal = parseFloat(document.getElementById('edit-sal-single').value) || 0;
        p.env = parseFloat(document.getElementById('edit-ship-single').value) || 0;
        p.tot = p.ade + p.sal + p.env;
        document.getElementById('total-idx-single').innerText = `TOTAL: $${p.tot} MXN`;
    }

    function closeOverlay() {
        if(activeCardId){
            const {cid, idx} = activeCardId;
            db.ref(`clientes_v3/${cid}/pedidos/${idx}`).set(clipData[cid].pedidos[idx]);
        }
        document.getElementById('overlay').style.display = 'none';
        activeCardId = null;
    }

    // 5. Auxiliares
    function filterClients() {
        const val = document.getElementById('search-input').value.toLowerCase();
        const res = document.getElementById('search-results'); 
        res.innerHTML = "";
        if(!val) { res.style.display='none'; return; }
        Object.keys(clipData).forEach(id => {
            if(clipData[id].nombre.toLowerCase().includes(val)) {
                const d = document.createElement('div'); 
                d.style.padding="12px"; d.style.color="#fff"; d.style.fontSize="11px"; 
                d.style.borderBottom="1px solid #222"; d.style.cursor="pointer";
                d.innerText=clipData[id].nombre;
                d.onclick=()=>{ 
                    selectedClientId=id; 
                    document.getElementById('search-input').value=clipData[id].nombre; 
                    res.style.display='none'; calculate(); 
                };
                res.appendChild(d);
            }
        });
        res.style.display='block';
    }

    function searchCatalog(input) {
        const val = input.value.toLowerCase();
        const resultsDiv = input.nextElementSibling;
        resultsDiv.innerHTML = "";
        if (val.length < 3) { resultsDiv.style.display = "none"; return; }
        const matches = catalogItems.filter(i => i.desc.toLowerCase().includes(val)).slice(0, 10);
        if (matches.length > 0) {
            matches.forEach(m => {
                const d = document.createElement('div');
                d.className = 'catalog-option';
                d.innerText = `${m.desc} ($${m.price} USD)`;
                d.onclick = () => {
                    input.value = m.desc;
                    const row = input.closest('.edit-row');
                    const priceInp = row.querySelector('.item-price') || row.querySelector('.it-p');
                    if (priceInp) priceInp.value = m.price;
                    resultsDiv.style.display = "none";
                    calculate();
                    if (activeCardId) overlayRecalc();
                };
                resultsDiv.appendChild(d);
            });
            resultsDiv.style.display = "block";
        }
    }

    function saveClient() {
        const n = document.getElementById('c-nom').value, t = document.getElementById('c-tel').value;
        if(!n || !t) return alert("Nombre y Tel obligatorios");
        db.ref('clientes_v3').push({ nombre: n, tel: t, email: document.getElementById('c-mail').value, direccion: document.getElementById('c-dir').value });
        alert("Cliente Guardado");
        showTab('calc');
    }

    function showTab(t) { 
        document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active')); document.getElementById('b-'+t).classList.add('active');
        ['calc','new','list'].forEach(id=>document.getElementById('tab-'+id).style.display = id==t?'block':'none');
    }

    function updatePay(cid, idx, field, val) { db.ref(`clientes_v3/${cid}/pedidos/${idx}/${field}`).set(!val); }
    function removeOrderCard(cid, idx) { if(confirm("¿Borrar pedido?")) { clipData[cid].pedidos.splice(idx, 1); db.ref(`clientes_v3/${cid}/pedidos`).set(clipData[cid].pedidos); } }
    function setShip(v) { currentShip=v; document.querySelectorAll('.ship-opt').forEach(o=>o.classList.remove('active')); document.getElementById('s-'+v).classList.add('active'); calculate(); }
    function addItemTab(id) {
        const div = document.createElement('div'); div.className = 'item-row edit-row';
        div.innerHTML = `<div style="flex:2; position:relative;"><input type="text" class="item-name input-box" placeholder="Producto..." style="margin:0; width:100%" oninput="searchCatalog(this)"><div class="catalog-results"></div></div><input type="number" class="item-qty input-box" value="1" style="width:60px; margin:0" oninput="calculate()"><input type="number" class="item-price input-box" placeholder="USD" style="width:80px; margin:0" oninput="calculate()">`;
        document.getElementById(id).appendChild(div);
    }
    function addItemOverlay() {
        const div = document.createElement('div'); div.className = 'edit-row';
        div.innerHTML = `<div style="flex:2; position:relative;"><input type="text" class="it-n" placeholder="Prod" oninput="searchCatalog(this); overlayRecalc()"><div class="catalog-results"></div></div><input type="number" class="it-q" value="1" style="width:45px" oninput="overlayRecalc()"><input type="number" class="it-p" placeholder="USD" style="width:60px" oninput="overlayRecalc()"><button class="btn-del" onclick="this.parentElement.remove(); overlayRecalc()">X</button>`;
