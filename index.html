<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FALLEN MINIS - Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <style>
        :root {
            --accent: #25D366;
            --bg: #0a0a0a;
            --card-bg: #141414;
            --border: #222;
            --text-main: #e0e0e0;
            --text-dim: #888;
            --font-main: 'Inter', sans-serif;
            --font-title: 'Outfit', sans-serif;
            --inp-bg: #1f1f1f;
            --inp-border: #2a2a2a;
            --inp-color: #fff;
            --nav-bg: #000;
            --res-bg: #000;
            --res-text: #bbb;
            --res-total: #fff;
            --client-bg: #1a1a1a;
            --badge-bg: #0f0f0f;
            --badge-border: #222;
            --badge-color: #444;
            --search-bg: #1f1f1f;
            --search-border: #333;
            --catalog-bg: #222;
            --catalog-border: #444;
            --catalog-item-border: #333;
            --catalog-color: #eee;
            --ship-border: #333;
        }

        body.light {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --border: #e0e0e0;
            --text-main: #1a1a1a;
            --text-dim: #888;
            --inp-bg: #f8f9fa;
            --inp-border: #dde1e7;
            --inp-color: #1a1a1a;
            --nav-bg: #e8eaed;
            --res-bg: #f0faf4;
            --res-text: #444;
            --res-total: #111;
            --client-bg: #fafafa;
            --badge-bg: #f5f5f5;
            --badge-border: #e0e0e0;
            --badge-color: #999;
            --search-bg: #f8f9fa;
            --search-border: #dde1e7;
            --catalog-bg: #fff;
            --catalog-border: #dde1e7;
            --catalog-item-border: #eee;
            --catalog-color: #222;
            --ship-border: #dde1e7;
        }

        /* ── FIREBASE LOGIN SCREEN ── */
        #fb-login-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: #0a0a0a;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .fb-login-box { width: 100%; max-width: 360px; text-align: center; }
        .fb-login-title {
            font-family: var(--font-title); font-size: 32px; font-weight: 900;
            color: #e0e0e0; margin-bottom: 4px; text-transform: uppercase; letter-spacing: -0.02em;
        }
        .fb-login-title span { color: var(--accent); }
        .fb-login-sub { font-size: 12px; color: #555; margin-bottom: 28px; text-transform: uppercase; letter-spacing: 0.1em; }
        .fb-login-card {
            background: #141414; border: 1px solid #222; border-radius: 20px; padding: 26px 22px;
        }
        .fb-inp {
            width: 100%; background: #1f1f1f; border: 1px solid #2a2a2a; border-radius: 12px;
            padding: 13px 14px; color: #fff; font-size: 14px; outline: none;
            font-family: var(--font-main); margin-bottom: 12px; box-sizing: border-box;
            transition: border 0.2s;
        }
        .fb-inp:focus { border-color: var(--accent); }
        .fb-btn {
            width: 100%; padding: 14px; border: none; border-radius: 12px;
            background: var(--accent); color: #000; font-family: var(--font-title);
            font-size: 14px; font-weight: 800; cursor: pointer; text-transform: uppercase;
            transition: opacity 0.2s; margin-top: 4px;
        }
        .fb-btn:hover { opacity: 0.88; }
        .fb-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .fb-err { font-size: 12px; color: #ff6b6b; min-height: 18px; margin-top: 8px; text-align: center; }
        .fb-eye {
            position: absolute; right: 12px; top: 50%; transform: translateY(-60%);
            background: none; border: none; color: #555; cursor: pointer; font-size: 16px; padding: 0;
        }

        /* ── TOGGLE BUTTON ── */
        .theme-toggle {
            position: fixed; bottom: 24px; right: 24px; z-index: 999;
            width: 50px; height: 50px; border-radius: 50%; border: none;
            background: var(--card-bg); box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            cursor: pointer; font-size: 22px; display: flex; align-items: center;
            justify-content: center; transition: transform 0.2s, background 0.3s;
            border: 1px solid var(--border);
        }
        .theme-toggle:hover { transform: scale(1.12); }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); font-family: var(--font-main); color: var(--text-main); line-height: 1.5; transition: background 0.3s, color 0.3s; }
        .card { transition: background 0.3s, border-color 0.3s; }
        
        .wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 500px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 24px; padding: 30px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); }
        
        h2 { font-family: var(--font-title); font-weight: 900; letter-spacing: -0.03em; text-transform: uppercase; text-align: center; margin-bottom: 5px; font-size: 26px; }
        .rate-info { text-align: center; font-size: 11px; color: var(--accent); margin-bottom: 20px; text-transform: uppercase; font-weight: 700; cursor: pointer; border: 1px solid #333; padding: 8px; border-radius: 10px; }

        .nav-tabs { display: flex; gap: 6px; margin-bottom: 25px; background: var(--nav-bg); padding: 6px; border-radius: 16px; transition: background 0.3s; }
        .nav-btn { flex: 1; background: transparent; border: none; color: var(--text-dim); padding: 10px 4px; border-radius: 12px; cursor: pointer; font-size: 10px; font-weight: 700; text-transform: uppercase; transition: all 0.2s ease; font-family: var(--font-title); }
        .nav-btn.active { background: #fff; color: #000; }

        .input-box { background: var(--inp-bg); border: 1px solid var(--inp-border); border-radius: 12px; padding: 14px; margin-bottom: 12px; width: 100%; color: var(--inp-color); font-size: 14px; outline: none; font-family: var(--font-main); transition: background 0.3s, border 0.3s, color 0.3s; }
        .label { display: block; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; font-weight: 700; font-family: var(--font-title); }

        .catalog-results { position: absolute; background: var(--catalog-bg); border: 1px solid var(--catalog-border); border-radius: 12px; max-height: 200px; overflow-y: auto; z-index: 1000; width: 100%; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.15); top: 50px; transition: background 0.3s; }
        .catalog-option { padding: 12px; font-size: 12px; cursor: pointer; border-bottom: 1px solid var(--catalog-item-border); color: var(--catalog-color); line-height: 1.3; transition: background 0.2s; }
        .catalog-option:hover { background: var(--inp-bg); color: var(--accent); }

        .client-item { background: var(--client-bg); padding: 22px; border-radius: 20px; margin-bottom: 14px; border: 1px solid var(--border); border-left: 4px solid var(--accent); position: relative; transition: background 0.3s; }
        .status-badge { flex: 1; text-align: center; padding: 10px 5px; border-radius: 10px; font-size: 8px; font-weight: 900; border: 1px solid var(--badge-border); background: var(--badge-bg); color: var(--badge-color); cursor: pointer; font-family: var(--font-title); transition: background 0.2s; }
        .status-paid { background: var(--accent) !important; color: #000 !important; }

        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 1000; overflow-y: auto; padding: 90px 25px; color: #111; }
        .close-overlay { position: fixed; top: 20px; right: 20px; background: #111; color: #fff; border: none; padding: 14px 24px; border-radius: 50px; font-weight: 700; font-size: 12px; cursor: pointer; z-index: 1010; font-family: var(--font-title); }
        
        .edit-row { display: flex; gap: 8px; margin-bottom: 8px; position: relative; }
        .btn-del { background: #ff4757; color: #fff; border: none; border-radius: 8px; padding: 0 10px; cursor: pointer; }
        .wa-btn { background: var(--accent); color: #000; border: none; padding: 18px; width: 100%; border-radius: 16px; font-weight: 800; font-family: var(--font-title); font-size: 15px; cursor: pointer; margin-top: 15px; text-transform: uppercase; }

        /* ── GRÁFICA DE TENDENCIA ── */
        .trend-wrap {
            margin-top: 14px;
            background: var(--badge-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 14px 10px;
        }
        .trend-title {
            font-family: var(--font-title); font-size: 9px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim);
            margin-bottom: 8px;
        }
        .trend-canvas-wrap { position: relative; height: 70px; }
        .trend-insights {
            display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px;
        }
        .trend-chip {
            font-size: 9px; font-weight: 800; font-family: var(--font-title);
            padding: 4px 9px; border-radius: 20px; text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .chip-green  { background: rgba(37,211,102,0.15); color: #25D366; }
        .chip-yellow { background: rgba(255,200,0,0.15);  color: #f0b429; }
        .chip-red    { background: rgba(255,71,87,0.15);  color: #ff4757; }
        .chip-blue   { background: rgba(80,160,255,0.15); color: #50a0ff; }
        .chip-gray   { background: rgba(136,136,136,0.15);color: #888; }

        /* ── DIFUSIÓN TAB ── */
        .dif-contact-row {
            display: flex; align-items: center; gap: 12px;
            background: var(--client-bg); border: 1px solid var(--border);
            border-radius: 14px; padding: 14px 16px; margin-bottom: 8px;
            cursor: pointer; transition: border-color 0.2s, background 0.2s;
        }
        .dif-contact-row.selected { border-color: var(--accent); background: rgba(37,211,102,0.07); }
        .dif-contact-row input[type="checkbox"] { accent-color: var(--accent); width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }
        .dif-contact-name { font-family: var(--font-title); font-weight: 700; font-size: 14px; flex: 1; }
        .dif-contact-tel { font-size: 11px; color: var(--text-dim); }

        .dif-template-btn {
            background: var(--inp-bg); border: 1px solid var(--inp-border); border-radius: 10px;
            padding: 10px 14px; font-size: 11px; font-weight: 700; font-family: var(--font-title);
            color: var(--text-dim); cursor: pointer; transition: all 0.2s; text-transform: uppercase;
        }
        .dif-template-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

        .dif-link-item {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            background: var(--inp-bg); border: 1px solid var(--inp-border);
            border-radius: 12px; padding: 14px 16px; margin-bottom: 8px;
        }
        .dif-link-name { font-size: 13px; font-weight: 700; font-family: var(--font-title); }
        .dif-link-btn {
            background: var(--accent); color: #000; border: none; border-radius: 10px;
            padding: 10px 18px; font-size: 11px; font-weight: 800; font-family: var(--font-title);
            cursor: pointer; white-space: nowrap; text-transform: uppercase;
        }
        .dif-select-all-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 10px;
        }
        .dif-counter {
            font-size: 11px; color: var(--accent); font-weight: 700; font-family: var(--font-title);
        }
        #dif-search {
            background: var(--inp-bg); border: 1px solid var(--inp-border); border-radius: 12px;
            padding: 12px 14px; width: 100%; color: var(--inp-color); font-size: 13px;
            outline: none; font-family: var(--font-main); margin-bottom: 12px;
            transition: border 0.2s;
        }
        #dif-search:focus { border-color: var(--accent); }
        #dif-msg {
            background: var(--inp-bg); border: 1px solid var(--inp-border); border-radius: 12px;
            padding: 14px; width: 100%; color: var(--inp-color); font-size: 13px;
            outline: none; font-family: var(--font-main); resize: vertical; min-height: 110px;
            line-height: 1.6; transition: border 0.2s;
        }
        #dif-msg:focus { border-color: var(--accent); }
        .dif-hint { font-size: 10px; color: var(--text-dim); margin-bottom: 10px; }
        .dif-section-title {
            font-family: var(--font-title); font-size: 11px; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim);
            margin-bottom: 10px; margin-top: 18px;
        }
        .dif-links-wrap { max-height: 300px; overflow-y: auto; }
        #dif-contacts-wrap { max-height: 220px; overflow-y: auto; }
        .dif-empty { text-align: center; color: var(--text-dim); font-size: 12px; padding: 20px 0; }
    </style>
</head>
<body>

<!-- ═══ FIREBASE LOGIN ═══ -->
<div id="fb-login-screen">
  <div class="fb-login-box">
    <div class="fb-login-title">FALLEN <span>MINIATURES</span></div>
    <div class="fb-login-sub">Management System</div>
    <div class="fb-login-card">
      <input class="fb-inp" id="fb-email" type="email" placeholder="Correo electrónico"
        autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('fb-pass').focus()"/>
      <div style="position:relative">
        <input class="fb-inp" id="fb-pass" type="password" placeholder="Contraseña"
          autocomplete="current-password" style="padding-right:42px;margin-bottom:0"
          onkeydown="if(event.key==='Enter')fbLogin()"/>
        <button class="fb-eye" onclick="fbTogglePass()" type="button" id="fb-eye-btn">👁</button>
      </div>
      <div class="fb-err" id="fb-err"></div>
      <button class="fb-btn" id="fb-btn" onclick="fbLogin()">Entrar</button>
    </div>
  </div>
</div>

<div id="overlay">
    <button class="close-overlay" onclick="closeOverlay()">CERRAR Y GUARDAR</button>
    <div id="overlay-content"></div>
</div>

<div id="main-app-wrapper" style="display:none;width:100%">
<div class="wrapper">
    <div class="card">
        <h2>FALLEN <span style="color:var(--accent)">MINIATURES</span></h2>
        <div class="rate-info" id="rate-display" onclick="updateManualRate()">Sincronizando...</div>
        
        <div class="nav-tabs">
            <button class="nav-btn active" id="b-calc" onclick="showTab('calc')">Cotizar</button>
            <button class="nav-btn" id="b-new" onclick="showTab('new')">Nuevo</button>
            <button class="nav-btn" id="b-list" onclick="showTab('list')">Base</button>
            <button class="nav-btn" id="b-dif" onclick="showTab('dif')">📢 Blast</button>
        </div>

        <!-- TAB: COTIZAR -->
        <div id="tab-calc">
            <input type="text" id="search-input" class="input-box" placeholder="Buscar cliente..." oninput="filterClients()" autocomplete="off">
            <div id="search-results" style="position:relative; background:var(--search-bg); display:none; border-radius:12px; margin-bottom:10px; max-height:150px; overflow-y:auto; z-index:100; border:1px solid var(--search-border); transition:background 0.3s"></div>
            
            <div id="items-container">
                <div class="item-row edit-row">
                    <div style="flex:2; position:relative;">
                        <input type="text" class="item-name input-box" placeholder="Producto..." style="margin:0; width:100%" oninput="searchCatalog(this)">
                        <div class="catalog-results"></div>
                    </div>
                    <input type="number" class="item-qty input-box" value="1" style="width:60px; margin:0" oninput="calculate()">
                    <input type="number" class="item-price input-box" placeholder="USD" style="width:80px; margin:0" oninput="calculate()">
                </div>
            </div>
            <button class="nav-btn" style="width:100%; border: 1px dashed #444; margin-bottom:20px;" onclick="addItemTab('items-container')">+ AÑADIR PRODUCTO</button>
            
            <label class="label">Descuento (ej: 100 o 10%)</label>
            <input type="text" id="calc-discount" class="input-box" value="0" oninput="calculate()">

            <label class="label">Envío</label>
            <div style="display:flex; gap:8px; margin-bottom:15px">
                <div class="ship-opt active" id="s-100" onclick="setShip(100)" style="flex:1; border:1px solid var(--ship-border); padding:10px; border-radius:12px; text-align:center; font-size:10px; cursor:pointer; transition:border 0.3s">📦 $100</div>
                <div class="ship-opt" id="s-225" onclick="setShip(225)" style="flex:1; border:1px solid var(--ship-border); padding:10px; border-radius:12px; text-align:center; font-size:10px; cursor:pointer; transition:border 0.3s">⚡ $225</div>
                <div class="ship-opt" id="s-0" onclick="setShip(0)" style="flex:1; border:1px solid var(--ship-border); padding:10px; border-radius:12px; text-align:center; font-size:10px; cursor:pointer; transition:border 0.3s">🎁 Gratis</div>
            </div>

            <div id="res-div" style="display:none">
                <div style="background:var(--res-bg); padding:20px; border-radius:20px; border-left:4px solid var(--accent); transition:background 0.3s">
                    <div id="r-text" style="font-size:11px; color:var(--res-text)"></div>
                    <div id="r-tot" style="font-size:20px; font-weight:900; color:var(--res-total); margin-top:5px"></div>
                </div>
                <button class="wa-btn" onclick="sendWA()">ENVIAR</button>
                <button class="nav-btn" style="width:100%; margin-top:10px; border:1px solid var(--accent); color:var(--accent)" onclick="saveOrder()">REGISTRAR EN BASE</button>
            </div>
        </div>

        <!-- TAB: NUEVO CLIENTE -->
        <div id="tab-new" style="display:none">
            <input type="text" id="c-nom" class="input-box" placeholder="Nombre completo">
            <input type="text" id="c-tel" class="input-box" placeholder="WhatsApp">
            <input type="email" id="c-mail" class="input-box" placeholder="E-mail">
            <textarea id="c-dir" class="input-box" placeholder="Dirección de envío" style="min-height:80px; resize:none"></textarea>
            <button class="wa-btn" style="background:#fff; color:#000" onclick="saveClient()">GUARDAR CLIENTE</button>
        </div>

        <!-- TAB: BASE -->
        <div id="tab-list" style="display:none"><div id="client-list"></div></div>

        <!-- TAB: DIFUSIÓN / BLAST ══════════════════════════════ -->
        <div id="tab-dif" style="display:none">

            <!-- PLANTILLAS -->
            <div class="dif-section-title">📋 Plantilla</div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px">
                <button class="dif-template-btn active" id="tpl-libre" onclick="setTemplate('libre')">Libre</button>
                <button class="dif-template-btn" id="tpl-promo" onclick="setTemplate('promo')">🎉 Promo</button>
                <button class="dif-template-btn" id="tpl-cobro" onclick="setTemplate('cobro')">💰 Recordatorio</button>
                <button class="dif-template-btn" id="tpl-seguimiento" onclick="setTemplate('seguimiento')">📦 Seguimiento</button>
            </div>

            <!-- MENSAJE -->
            <div class="dif-section-title">✏️ Mensaje</div>
            <div class="dif-hint">Usa <strong>{nombre}</strong> para personalizar con el nombre del cliente.</div>
            <textarea id="dif-msg" placeholder="Escribe tu mensaje aquí..."></textarea>

            <!-- BUSCAR Y SELECCIONAR CONTACTOS -->
            <div class="dif-section-title">👥 Contactos</div>
            <input type="text" id="dif-search" placeholder="Filtrar por nombre..." oninput="renderDifContacts()">
            <div class="dif-select-all-row">
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:12px; font-weight:700; font-family:var(--font-title)">
                    <input type="checkbox" id="dif-check-all" onchange="toggleSelectAll(this.checked)" style="accent-color:var(--accent); width:16px; height:16px;">
                    SELECCIONAR TODOS
                </label>
                <span class="dif-counter" id="dif-counter">0 seleccionados</span>
            </div>
            <div id="dif-contacts-wrap"></div>

            <!-- GENERAR LINKS -->
            <button class="wa-btn" onclick="generateDifLinks()" style="margin-top:18px">
                📲 GENERAR LINKS DE WHATSAPP
            </button>

            <!-- PANEL DE LINKS GENERADOS -->
            <div id="dif-links-panel" style="display:none; margin-top:20px">
                <div class="dif-section-title">🔗 Abre cada chat</div>
                <div class="dif-links-wrap" id="dif-links-wrap"></div>
            </div>

        </div>
        <!-- FIN TAB DIFUSIÓN ════════════════════════════════════ -->

    </div>
</div>

<script>
    const CATALOG_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTrUSvEa7fBbwChq6ycG3JUGUGVzQ1AQbYCDV1PsOlilKy5X-px_PkuIiHTl5IZ76xQ1khOP_9MKlKR/pub?gid=751903595&single=true&output=csv';
    const firebaseConfig = {
        apiKey: "AIzaSyDUYD_gMxeemWt-dfJrPtN8njzmV7HoJ48",
        authDomain: "fallen-cotizador.firebaseapp.com",
        databaseURL: "https://fallen-cotizador-default-rtdb.firebaseio.com",
        projectId: "fallen-cotizador"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    let currentRate = 18.00, clipData = {}, lastCalc = {}, selectedClientId = "", currentShip = 100, catalogItems = [], activeCardId = null;

    // ── FIREBASE AUTH ────────────────────────────
    function fbLogin(){
      const email = document.getElementById('fb-email').value.trim();
      const pass  = document.getElementById('fb-pass').value;
      const err   = document.getElementById('fb-err');
      const btn   = document.getElementById('fb-btn');
      if(!email || !pass){ err.textContent = 'Ingresa correo y contraseña'; return; }
      err.textContent = '';
      btn.disabled = true; btn.textContent = 'Verificando...';
      auth.signInWithEmailAndPassword(email, pass)
        .catch(e => {
          btn.disabled = false; btn.textContent = 'Entrar';
          const msgs = {

    // 1. Catálogo y Tipo de Cambio
    async function fetchCatalog() {
        try {
            const response = await fetch(CATALOG_URL, { cache: "no-store" });
            const data = await response.text();
            const rows = data.split(/\r?\n/).filter(row => row.trim() !== "");
            catalogItems = rows.map(row => {
                const cleanRow = row.replace(/^"|"$/g, '').replace(/""/g, '"').trim();
                const match = cleanRow.match(/(.+)\s*-\s*\$(\d+\.?\d*)\s*usd/i);
                if (match) return { desc: match[1].trim(), price: parseFloat(match[2]) };
                return null;
            }).filter(item => item !== null);
            fetchExchangeRate();
        } catch (e) { document.getElementById('rate-display').innerText = "ERROR CATÁLOGO"; }
    }

    async function fetchExchangeRate() {
        try {
            const res = await fetch('https://open.er-api.com/v6/latest/USD');
            const data = await res.json();
            if(data.rates.MXN) { currentRate = data.rates.MXN; updateRateUI(); }
        } catch(e) { updateRateUI(); }
    }

    function updateRateUI() { 
        document.getElementById('rate-display').innerText = `DÓLAR: $${currentRate.toFixed(2)} MXN`; 
        calculate(); 
    }

    function updateManualRate() { 
        let n = prompt("Cambio USD:", currentRate); 
        if(n){ currentRate = parseFloat(n); updateRateUI(); } 
    }

    // 2. Lógica de Redondeo
    function parseDiscount(val, subtotal) {
        if (!val) return 0;
        let sVal = val.toString().trim();
        if (sVal.endsWith('%')) {
            let pct = parseFloat(sVal.replace('%', '')) || 0;
            return Math.ceil(subtotal * (pct / 100));
        }
        return parseFloat(sVal) || 0;
    }

    function calculate() {
        let usd = 0;
        document.querySelectorAll('#tab-calc .item-row').forEach(r => {
            const q = parseFloat(r.querySelector('.item-qty').value) || 0;
            const p = parseFloat(r.querySelector('.item-price').value) || 0;
            usd += q * p;
        });
        if(usd > 0) {
            let mxn = usd * currentRate;
            let descInput = document.getElementById('calc-discount').value;
            let descMonto = Math.ceil(parseDiscount(descInput, mxn));
            let mxnConDesc = mxn - descMonto;
            lastCalc = { 
                ade: Math.ceil(mxnConDesc * 0.6), 
                sal: Math.ceil(mxnConDesc * 0.4), 
                ship: currentShip, 
                descVal: descInput, 
                descMonto: descMonto, 
                tot: Math.ceil(mxnConDesc) + currentShip 
            };
            document.getElementById('r-text').innerHTML = `60% Ant: $${lastCalc.ade} | 40% Sal: $${lastCalc.sal} | Env: $${currentShip}`;
            if(descMonto > 0) document.getElementById('r-text').innerHTML += ` | Desc: -$${descMonto}`;
            document.getElementById('r-tot').innerText = `TOTAL: $${lastCalc.tot} MXN`;
            document.getElementById('res-div').style.display = 'block';
        }
    }

    // ── GRÁFICA DE TENDENCIA ──
    function drawTrendChart(cid, pedidos) {
        const canvas = document.getElementById(`chart-${cid}`);
        if(!canvas) return;
        const labels = pedidos.map((p, i) => p.fecha ? p.fecha.split('/').slice(0,2).join('/') : `P${i+1}`);
        const data   = pedidos.map(p => p.tot || 0);
        const isLight = document.body.classList.contains('light');
        const gridColor  = isLight ? 'rgba(0,0,0,0.07)' : 'rgba(255,255,255,0.05)';
        const labelColor = isLight ? '#888' : '#555';

        if(chartInstances[cid]) chartInstances[cid].destroy();

        chartInstances[cid] = new Chart(canvas, {
            type: 'line',
            data: {
                labels,
                datasets: [{
                    data,
                    borderColor: '#25D366',
                    backgroundColor: 'rgba(37,211,102,0.08)',
                    borderWidth: 2,
                    pointBackgroundColor: '#25D366',
                    pointRadius: data.length === 1 ? 5 : 3,
                    pointHoverRadius: 6,
                    tension: 0.35,
                    fill: true,
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false }, tooltip: {
                    callbacks: { label: ctx => ` $${ctx.parsed.y.toLocaleString()} MXN` }
                }},
                scales: {
                    x: { grid: { color: gridColor }, ticks: { color: labelColor, font: { size: 9 }, maxTicksLimit: 6 } },
                    y: { grid: { color: gridColor }, ticks: { color: labelColor, font: { size: 9 },
                        callback: v => `$${(v/1000).toFixed(0)}k`
                    }}
                }
            }
        });
    }

    // ── INSIGHTS INTELIGENTES ──
    function renderInsights(cid, pedidos) {
        const el = document.getElementById(`insights-${cid}`);
        if(!el) return;

        const totales = pedidos.map(p => p.tot || 0);
        const totalHistorico = totales.reduce((a,b) => a+b, 0);
        const ticketProm = Math.round(totalHistorico / pedidos.length);
        const n = pedidos.length;

        // Calcular días desde el último pedido
        let diasDesdeUltimo = null;
        const lastPed = pedidos[pedidos.length - 1];
        if(lastPed.fecha) {
            const parts = lastPed.fecha.split('/');
            if(parts.length >= 3) {
                const d = new Date(parts[2], parts[1]-1, parts[0]);
                diasDesdeUltimo = Math.floor((Date.now() - d.getTime()) / 86400000);
            }
        }

        // Tendencia (comparar última mitad vs primera mitad)
        let tendenciaChip = '';
        if(n >= 3) {
            const mitad = Math.floor(n/2);
            const promReciente = totales.slice(-mitad).reduce((a,b)=>a+b,0)/mitad;
            const promAntiguo  = totales.slice(0, mitad).reduce((a,b)=>a+b,0)/mitad;
            if(promReciente > promAntiguo * 1.1)
                tendenciaChip = `<span class="trend-chip chip-green">📈 Creciendo</span>`;
            else if(promReciente < promAntiguo * 0.9)
                tendenciaChip = `<span class="trend-chip chip-red">📉 Bajando</span>`;
            else
                tendenciaChip = `<span class="trend-chip chip-blue">➡️ Estable</span>`;
        }

        // Frecuencia
        let freqChip = '';
        if(n === 1) freqChip = `<span class="trend-chip chip-gray">1er pedido</span>`;
        else if(n >= 5) freqChip = `<span class="trend-chip chip-green">⭐ Cliente frecuente</span>`;
        else if(n >= 3) freqChip = `<span class="trend-chip chip-blue">Cliente recurrente</span>`;
        else freqChip = `<span class="trend-chip chip-gray">${n} pedidos</span>`;

        // Actividad reciente
        let actividadChip = '';
        if(diasDesdeUltimo !== null) {
            if(diasDesdeUltimo <= 30)
                actividadChip = `<span class="trend-chip chip-green">🟢 Activo</span>`;
            else if(diasDesdeUltimo <= 90)
                actividadChip = `<span class="trend-chip chip-yellow">🟡 ${diasDesdeUltimo}d sin comprar</span>`;
            else
                actividadChip = `<span class="trend-chip chip-red">🔴 ${diasDesdeUltimo}d inactivo</span>`;
        }

        // Sugerencia
        let sugerenciaChip = '';
        if(diasDesdeUltimo !== null && diasDesdeUltimo > 60 && n >= 2)
            sugerenciaChip = `<span class="trend-chip chip-yellow">💡 Candidate a promo</span>`;
        if(n >= 5 && diasDesdeUltimo !== null && diasDesdeUltimo <= 60)
            sugerenciaChip = `<span class="trend-chip chip-green">🎁 Merece descuento</span>`;

        el.innerHTML = `
            ${freqChip}${actividadChip}${tendenciaChip}${sugerenciaChip}
            <span class="trend-chip chip-gray">Total: $${totalHistorico.toLocaleString()}</span>
            <span class="trend-chip chip-gray">Prom: $${ticketProm.toLocaleString()}</span>
        `;
    }

        document.querySelectorAll('#items-edit-single .edit-row').forEach(r => {

        const val = input.value.toLowerCase();

        const matches = catalogItems.filter(i => i.desc.toLowerCase().includes(val)).slice(0, 10);
        if (matches.length > 0) {
            matches.forEach(m => {
                const d = document.createElement('div');
                d.className = 'catalog-option';
                d.innerText = `${m.desc} ($${m.price} USD)`;
                d.onclick = () => {
                    input.value = m.desc;
                    const row = input.closest('.edit-row');
                    const priceInp = row.querySelector('.item-price') || row.querySelector('.it-p');
                    if (priceInp) priceInp.value = m.price;
                    resultsDiv.style.display = "none";
                    calculate();
                    if (activeCardId) overlayRecalc();
                };
                resultsDiv.appendChild(d);
            });
            resultsDiv.style.display = "block";

        const urlWebApp = "https://script.google.com/macros/s/AKfycbwnNhbxjqYtpfhAGd4SsOSSYDH4Ddlsoa2iiME7fPYGzPrTZCxEzEQBoO8d3aCDvz4W/exec";
        try {
            fetch(urlWebApp, { method: "POST", mode: "no-cors", body: JSON.stringify(datosSheets) });
            await db.ref('clientes_v3').push({ nombre: n, tel: t, email: m, direccion: d });
            alert("Cliente guardado en ambos sistemas");
            document.getElementById('c-nom').value = "";
            document.getElementById('c-tel').value = "";
            document.getElementById('c-mail').value = "";
            document.getElementById('c-dir').value = "";
            showTab('calc');
        } catch (e) { alert("Error al guardar cliente"); }
    }

    function showTab(t) { 
        document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active')); 
        document.getElementById('b-'+t).classList.add('active');
        ['calc','new','list','dif'].forEach(id=>document.getElementById('tab-'+id).style.display = id==t?'block':'none');
        if(t === 'dif') renderDifContacts();
    }

    function updatePay(cid, idx, field, val) { db.ref(`clientes_v3/${cid}/pedidos/${idx}/${field}`).set(!val); }
    function removeOrderCard(cid, idx) { if(confirm("¿Borrar pedido?")) { clipData[cid].pedidos.splice(idx, 1); db.ref(`clientes_v3/${cid}/pedidos`).set(clipData[cid].pedidos); } }
    function setShip(v) { currentShip=v; document.querySelectorAll('.ship-opt').forEach(o=>o.classList.remove('active')); document.getElementById('s-'+v).classList.add('active'); calculate(); }
    
    function addItemTab(id) {
        const div = document.createElement('div'); div.className = 'item-row edit-row';
        div.innerHTML = `<div style="flex:2; position:relative;"><input type="text" class="item-name input-box" placeholder="Producto..." style="margin:0; width:100%" oninput="searchCatalog(this)"><div class="catalog-results"></div></div><input type="number" class="item-qty input-box" value="1" style="width:60px; margin:0" oninput="calculate()"><input type="number" class="item-price input-box" placeholder="USD" style="width:80px; margin:0" oninput="calculate()">`;
        document.getElementById(id).appendChild(div);
    }
    function addItemOverlay() {
        const div = document.createElement('div'); div.className = 'edit-row';
        div.innerHTML = `<div style="flex:2; position:relative;"><input type="text" class="it-n" placeholder="Prod" oninput="searchCatalog(this); overlayRecalc()"><div class="catalog-results"></div></div><input type="number" class="it-q" value="1" style="width:45px" oninput="overlayRecalc()"><input type="number" class="it-p" placeholder="USD" style="width:60px" oninput="overlayRecalc()"><button class="btn-del" onclick="this.parentElement.remove(); overlayRecalc()">X</button>`;
        document.getElementById('items-edit-single').appendChild(div);
    }

    // ── WHATSAPP FUNCTIONS ──
    function sendWA() {
        const cli = clipData[selectedClientId];
        if(!cli) return alert("Selecciona un cliente");
        let msg = `*FALLEN MINIATURES - COTIZACIÓN*\n\n`;
        document.querySelectorAll('#tab-calc .item-row').forEach(r => {
            const n = r.querySelector('.item-name').value;
            const q = r.querySelector('.item-qty').value;
            if(n) msg += `• ${q}x ${n}\n`;
        });
        msg += `\n*Anticipo (60%):* $${lastCalc.ade} MXN\n`;
        msg += `*Saldo (40%):* $${lastCalc.sal} MXN\n`;
        msg += `*Envío:* $${lastCalc.ship} MXN\n`;
        if(lastCalc.descMonto > 0) msg += `*Descuento:* -$${lastCalc.descMonto} MXN\n`;
        msg += `\n*TOTAL:* $${lastCalc.tot} MXN`;
        const fTel = cli.tel.replace(/\D/g, '');
        window.open(`https://wa.me/52${fTel}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function sendCobranza(cid, idx) {
        const cli = clipData[cid];
        const p = cli.pedidos[idx];
        let msg = `*RECORDATORIO DE PAGO - FALLEN MINIATURES*\n\n`;
        msg += `Hola *${cli.nombre}*, te comparto el estado de tu pedido:\n\n`;
        if(!p.pagA) msg += `• *Anticipo Pendiente:* $${p.ade} MXN\n`;
        if(!p.pagS) msg += `• *Saldo Pendiente:* $${p.sal} MXN\n`;
        if(!p.pagE) msg += `• *Envío Pendiente:* $${p.env} MXN\n`;
        msg += `\n*Total a liquidar:* $${p.tot} MXN\n\n_Gracias._`;
        const fTel = cli.tel.replace(/\D/g, '');
        window.open(`https://wa.me/52${fTel}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    // ════════════════════════════════════════════
    //  DIFUSIÓN / BLAST
    // ════════════════════════════════════════════

    const TEMPLATES = {
        libre: '',
        promo: `🎉 *¡Hola {nombre}!*\n\nTenemos una promoción especial para ti 👇\n\n✨ [Describe tu promo aquí]\n\n¡No te la pierdas! Contáctanos para más info. 🎨\n\n_— Fallen Miniatures_`,
        cobro: `💰 *Hola {nombre}*, te enviamos un recordatorio de pago de tu pedido con Fallen Miniatures.\n\nSi tienes alguna duda, con gusto te ayudamos. 🙌\n\n_— Fallen Miniatures_`,
        seguimiento: `📦 *¡Hola {nombre}!*\n\nQuería darte una actualización sobre el estado de tu pedido con Fallen Miniatures.\n\n[Escribe aquí la actualización]\n\n¡Gracias por tu confianza! 🎨\n\n_— Fallen Miniatures_`
    };

    let currentTemplate = 'libre';

    function setTemplate(key) {
        currentTemplate = key;
        document.querySelectorAll('.dif-template-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tpl-' + key).classList.add('active');
        document.getElementById('dif-msg').value = TEMPLATES[key];
        // Ocultar panel de links al cambiar plantilla
        document.getElementById('dif-links-panel').style.display = 'none';
    }

    function renderDifContacts() {
        const wrap = document.getElementById('dif-contacts-wrap');
        if(!wrap) return;
        const filter = (document.getElementById('dif-search')?.value || '').toLowerCase();
        wrap.innerHTML = '';

        const ids = Object.keys(clipData);
        // Deduplicar por nombre+tel para no mostrar el mismo cliente múltiples veces
        const seen = new Set();
        const contacts = [];
        ids.forEach(cid => {
            const cli = clipData[cid];
            if(!cli.nombre || !cli.tel) return;
            const key = cli.tel.replace(/\D/g,'');
            if(seen.has(key)) return;
            seen.add(key);
            contacts.push({ cid, nombre: cli.nombre, tel: cli.tel });
        });

        const filtered = filter ? contacts.filter(c => c.nombre.toLowerCase().includes(filter)) : contacts;

        if(filtered.length === 0) {
            wrap.innerHTML = `<div class="dif-empty">No hay contactos${filter ? ' con ese filtro' : ' en la base'}.</div>`;
            updateDifCounter();
            return;
        }

        filtered.forEach(c => {
            const row = document.createElement('div');
            row.className = 'dif-contact-row';
            row.dataset.cid = c.cid;
            row.dataset.nombre = c.nombre;
            row.dataset.tel = c.tel;
            row.innerHTML = `
                <input type="checkbox" id="dif-chk-${c.cid}" onchange="onDifCheck(this)">
                <label for="dif-chk-${c.cid}" style="flex:1; cursor:pointer">
                    <div class="dif-contact-name">${c.nombre}</div>
                    <div class="dif-contact-tel">${c.tel}</div>
                </label>`;
            row.querySelector('input').addEventListener('change', () => {
                row.classList.toggle('selected', row.querySelector('input').checked);
            });
            wrap.appendChild(row);
        });

        updateDifCounter();
    }

    function onDifCheck(checkbox) {
        const row = checkbox.closest('.dif-contact-row');
        row.classList.toggle('selected', checkbox.checked);
        updateDifCounter();
        // Sincronizar "seleccionar todos"
        const all = document.querySelectorAll('#dif-contacts-wrap input[type=checkbox]');
        const checked = document.querySelectorAll('#dif-contacts-wrap input[type=checkbox]:checked');
        document.getElementById('dif-check-all').indeterminate = checked.length > 0 && checked.length < all.length;
        document.getElementById('dif-check-all').checked = checked.length === all.length && all.length > 0;
    }

    function toggleSelectAll(checked) {
        document.querySelectorAll('#dif-contacts-wrap .dif-contact-row').forEach(row => {
            row.querySelector('input').checked = checked;
            row.classList.toggle('selected', checked);
        });
        updateDifCounter();
    }

    function updateDifCounter() {
        const n = document.querySelectorAll('#dif-contacts-wrap input[type=checkbox]:checked').length;
        const el = document.getElementById('dif-counter');
        if(el) el.textContent = `${n} seleccionado${n !== 1 ? 's' : ''}`;
    }

    function generateDifLinks() {
        const msg = document.getElementById('dif-msg').value.trim();
        if(!msg) return alert('Escribe un mensaje antes de generar los links.');

        const selected = [];
        document.querySelectorAll('#dif-contacts-wrap .dif-contact-row').forEach(row => {
            if(row.querySelector('input').checked) {
                selected.push({ nombre: row.dataset.nombre, tel: row.dataset.tel });
            }
        });

        if(selected.length === 0) return alert('Selecciona al menos un contacto.');

        const panel = document.getElementById('dif-links-panel');
        const wrap  = document.getElementById('dif-links-wrap');
        wrap.innerHTML = '';

        selected.forEach(c => {
            const personalMsg = msg.replace(/\{nombre\}/gi, c.nombre.split(' ')[0]);
            const tel = c.tel.replace(/\D/g, '');
            const url = `https://wa.me/52${tel}?text=${encodeURIComponent(personalMsg)}`;

            const item = document.createElement('div');
            item.className = 'dif-link-item';
            item.innerHTML = `
                <div>
                    <div class="dif-link-name">${c.nombre}</div>
                    <div style="font-size:10px; color:var(--text-dim)">${c.tel}</div>
                </div>
                <button class="dif-link-btn" onclick="window.open('${url}', '_blank'); this.textContent='✅ Abierto'; this.style.background='#1aab55'">
                    ABRIR WA
                </button>`;
            wrap.appendChild(item);
        });

        panel.style.display = 'block';
        panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ── THEME TOGGLE ──
    const THEME_KEY = 'fm_theme';
    function applyTheme(theme){
        if(theme === 'light'){
            document.body.classList.add('light');
            document.getElementById('theme-toggle-btn').textContent = '🌙';
        } else {
            document.body.classList.remove('light');
            document.getElementById('theme-toggle-btn').textContent = '☀️';
        }
        localStorage.setItem(THEME_KEY, theme);
    }
    function toggleTheme(){
        const current = document.body.classList.contains('light') ? 'light' : 'dark';
        applyTheme(current === 'light' ? 'dark' : 'light');
        // Redibujar gráficas con los colores del nuevo tema
        requestAnimationFrame(() => {
            Object.keys(clipData).forEach(cid => {
                const cli = clipData[cid];
                if(cli.pedidos && cli.pedidos.length >= 1) drawTrendChart(cid, cli.pedidos);
            });
        });
    }
    // El tema se aplica en onAuthStateChanged al mostrar la app
</script>

  <span id="user-email-badge"></span> · SALIR
</button>

</div><!-- /main-app-wrapper -->
