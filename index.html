<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FALLEN MINIS - Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --accent: #25D366; --bg: #0a0a0a; --card-bg: #141414; --border: #222; --text-main: #e0e0e0; --text-dim: #888; --font-main: 'Inter', sans-serif; --font-title: 'Outfit', sans-serif; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); font-family: var(--font-main); color: var(--text-main); line-height: 1.5; }
        .wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { width: 100%; max-width: 500px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 24px; padding: 30px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); position: relative; }
        h2 { font-family: var(--font-title); font-weight: 900; letter-spacing: -0.03em; text-transform: uppercase; text-align: center; margin-bottom: 20px; font-size: 26px; }
        .rate-info { text-align: center; font-size: 10px; color: var(--accent); margin-bottom: 20px; text-transform: uppercase; font-weight: 700; border: 1px solid #333; padding: 8px; border-radius: 10px; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 25px; background: #000; padding: 6px; border-radius: 16px; }
        .nav-btn { flex: 1; background: transparent; border: none; color: var(--text-dim); padding: 12px; border-radius: 12px; cursor: pointer; font-size: 11px; font-weight: 700; text-transform: uppercase; font-family: var(--font-title); }
        .nav-btn.active { background: #fff; color: #000; }
        .input-box { background: #1f1f1f; border: 1px solid #2a2a2a; border-radius: 12px; padding: 14px; margin-bottom: 12px; width: 100%; color: #fff; font-size: 14px; outline: none; }
        .client-item { background: #1a1a1a; padding: 20px; border-radius: 18px; margin-bottom: 12px; border: 1px solid var(--border); border-left: 4px solid var(--accent); position: relative; }
        .status-badge { flex: 1; text-align: center; padding: 10px 5px; border-radius: 10px; font-size: 9px; font-weight: 900; background: #0f0f0f; color: #444; cursor: pointer; border: 1px solid #222; }
        .status-paid { background: var(--accent) !important; color: #000 !important; }
        .wa-btn { background: var(--accent); color: #000; border: none; padding: 18px; width: 100%; border-radius: 16px; font-weight: 800; font-family: var(--font-title); cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        #overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:#fff; z-index:2000; padding:40px 20px; color:#000; overflow-y:auto; }
    </style>
</head>
<body>

<div id="overlay">
    <button onclick="cerrarOverlay()" style="float:right; padding:10px; background:#000; color:#fff; border-radius:10px; border:none; font-weight:bold">CERRAR</button>
    <div id="overlay-content"></div>
</div>

<div class="wrapper">
    <div class="card">
        <h2>FALLEN <span style="color:var(--accent)">MINIS</span></h2>
        <div class="rate-info" id="status-db">Cargando base de datos...</div>
        
        <div class="nav-tabs">
            <button class="nav-btn active" id="btn-calc" onclick="tab('calc')">Nueva</button>
            <button class="nav-btn" id="btn-list" onclick="tab('list')">Pedidos</button>
            <button class="nav-btn" id="btn-db" onclick="tab('db')">Clientes</button>
        </div>

        <div id="tab-calc">
            <input type="text" id="bus-cli" class="input-box" placeholder="Buscar cliente..." oninput="buscarCli()">
            <div id="res-bus" style="display:none; background:#111; border-radius:10px; padding:5px; margin-bottom:10px; border:1px solid #333"></div>
            
            <div id="cont-items">
                <div style="display:flex; gap:5px; margin-bottom:10px">
                    <input type="text" placeholder="Producto" class="input-box" style="flex:2; margin:0">
                    <input type="number" placeholder="USD" class="input-box i-p" style="width:80px; margin:0" oninput="recalc()">
                </div>
            </div>
            <button class="nav-btn" style="width:100%; border:1px dashed #444; margin-bottom:15px" onclick="addFila()">+ AÑADIR OTRO</button>
            
            <div id="box-res" style="display:none; background:#000; padding:15px; border-radius:15px; border:1px solid var(--accent)">
                <div id="txt-det" style="font-size:11px; color:#888"></div>
                <div id="txt-tot" style="font-size:22px; font-weight:900; color:#fff"></div>
                <button class="wa-btn" onclick="registrar()">REGISTRAR PEDIDO</button>
            </div>
        </div>

        <div id="tab-list" style="display:none">
            <div id="lista-pedidos"></div>
        </div>

        <div id="tab-db" style="display:none">
            <input type="text" id="n-cli" class="input-box" placeholder="Nombre completo">
            <input type="text" id="t-cli" class="input-box" placeholder="WhatsApp (10 dígitos)">
            <button class="wa-btn" style="background:#fff; color:#000" onclick="guardarCli()">GUARDAR NUEVO CLIENTE</button>
        </div>
    </div>
</div>

<script>
    // CONFIGURACIÓN FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyDUYD_gMxeemWt-dfJrPtN8njzmV7HoJ48",
        authDomain: "fallen-cotizador.firebaseapp.com",
        databaseURL: "https://fallen-cotizador-default-rtdb.firebaseio.com",
        projectId: "fallen-cotizador"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let clipSelected = null;
    let baseDatosClientes = {};
    let pedidosActivos = {};
    const TIPO_CAMBIO = 18.50; // Ajustable

    // ESCUCHA DE DATOS
    db.ref('/').on('value', snap => {
        const data = snap.val() || {};
        baseDatosClientes = data.clientes || {};
        pedidosActivos = data.pedidos_final || {};
        document.getElementById('status-db').innerText = "BASE DE DATOS CONECTADA";
        renderPedidos();
    }, err => {
        document.getElementById('status-db').innerText = "ERROR DE CONEXIÓN";
    });

    function renderPedidos() {
        const div = document.getElementById('lista-pedidos');
        div.innerHTML = "";
        const keys = Object.keys(pedidosActivos);
        if(keys.length === 0) { div.innerHTML = "<div style='text-align:center; padding:20px; color:#555'>No hay pedidos.</div>"; return; }
        
        keys.reverse().forEach(id => {
            const p = pedidosActivos[id];
            div.innerHTML += `
                <div class="client-item">
                    <button onclick="eliminar('${id}')" style="position:absolute; top:10px; right:10px; background:none; border:none; color:#444">×</button>
                    <div style="font-weight:800; font-size:16px; color:#fff">${p.cliente}</div>
                    <div style="font-size:11px; color:var(--accent); margin-bottom:10px">Total: $${p.total} MXN</div>
                    <div style="display:flex; gap:5px">
                        <div class="status-badge ${p.pagoA?'status-paid':''}" onclick="toggleP('${id}','pagoA')">ANTICIPO</div>
                        <div class="status-badge ${p.pagoS?'status-paid':''}" onclick="toggleP('${id}','pagoS')">SALDO</div>
                    </div>
                </div>
            `;
        });
    }

    // FUNCIONES LÓGICA
    function tab(t) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-'+t).classList.add('active');
        document.getElementById('tab-calc').style.display = t=='calc'?'block':'none';
        document.getElementById('tab-list').style.display = t=='list'?'block':'none';
        document.getElementById('tab-db').style.display = t=='db'?'block':'none';
    }

    function addFila() {
        const d = document.createElement('div');
        d.style.display = "flex"; d.style.gap = "5px"; d.style.marginBottom = "10px";
        d.innerHTML = `<input type="text" placeholder="Producto" class="input-box" style="flex:2; margin:0">
                       <input type="number" placeholder="USD" class="input-box i-p" style="width:80px; margin:0" oninput="recalc()">`;
        document.getElementById('cont-items').appendChild(d);
    }

    function recalc() {
        let usd = 0;
        document.querySelectorAll('.i-p').forEach(i => usd += (parseFloat(i.value) || 0));
        if(usd > 0) {
            let mxn = Math.ceil(usd * TIPO_CAMBIO);
            document.getElementById('txt-det').innerText = `Cambio: $${TIPO_CAMBIO} | USD: $${usd}`;
            document.getElementById('txt-tot').innerText = `TOTAL: $${mxn} MXN`;
            document.getElementById('box-res').style.display = "block";
            return mxn;
        }
        document.getElementById('box-res').style.display = "none";
        return 0;
    }

    function registrar() {
        if(!clipSelected) return alert("Selecciona un cliente de la lista");
        const total = recalc();
        db.ref('pedidos_final').push({
            cliente: clipSelected.nombre,
            tel: clipSelected.tel,
            total: total,
            pagoA: false,
            pagoS: false,
            fecha: new Date().toLocaleDateString()
        });
        alert("¡Pedido registrado!");
        tab('list');
    }

    function guardarCli() {
        const n = document.getElementById('n-cli').value;
        const t = document.getElementById('t-cli').value;
        if(!n || !t) return alert("Faltan datos");
        db.ref('clientes').push({ nombre: n, tel: t });
        alert("Cliente guardado");
        document.getElementById('n-cli').value = "";
        document.getElementById('t-cli').value = "";
        tab('calc');
    }

    function buscarCli() {
        const val = document.getElementById('bus-cli').value.toLowerCase();
        const res = document.getElementById('res-bus');
        res.innerHTML = "";
        if(!val) { res.style.display = "none"; return; }
        Object.keys(baseDatosClientes).forEach(id => {
            const c = baseDatosClientes[id];
            if(c.nombre.toLowerCase().includes(val)) {
                const d = document.createElement('div');
                d.style.padding = "10px"; d.style.cursor = "pointer"; d.style.fontSize = "12px";
                d.innerText = c.nombre;
                d.onclick = () => {
                    clipSelected = c;
                    document.getElementById('bus-cli').value = c.nombre;
                    res.style.display = "none";
                };
                res.appendChild(d);
            }
        });
        res.style.display = "block";
    }

    function toggleP(id, campo) {
        db.ref(`pedidos_final/${id}/${campo}`).set(!pedidosActivos[id][campo]);
    }

    function eliminar(id) {
        if(confirm("¿Borrar tarjeta?")) db.ref(`pedidos_final/${id}`).remove();
    }
</script>
</body>
</html>
